<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">

  <title>沖繩自駕 4天3夜質感遊記與智慧行程手冊 - Ku Visual Hub (加密保護)</title>
  <meta name="robots" content="noindex, nofollow">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 0%, #0f172a 0%, #020617 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 1.25rem;
      padding: 2.25rem 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 35px rgba(14, 165, 233, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      text-align: center;
      position: relative;
    }
    .icon-badge {
      width: 60px;
      height: 60px;
      margin: 0 auto 1.25rem;
      border-radius: 1rem;
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.2), rgba(99, 102, 241, 0.25));
      border: 1px solid rgba(56, 189, 248, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      box-shadow: 0 8px 20px rgba(14, 165, 233, 0.2);
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0.5rem;
      letter-spacing: -0.01em;
    }
    .page-name {
      font-size: 0.85rem;
      color: #38bdf8;
      background: rgba(14, 165, 233, 0.1);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      display: inline-block;
      margin-bottom: 1.25rem;
      border: 1px solid rgba(56, 189, 248, 0.2);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    p {
      font-size: 0.875rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
      text-align: left;
    }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    input[type="password"], input[type="text"] {
      width: 100%;
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 0.75rem;
      padding: 0.85rem 3rem 0.85rem 1rem;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }
    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }
    .toggle-pwd {
      position: absolute;
      right: 0.85rem;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.25rem;
    }
    .toggle-pwd:hover { color: #94a3b8; }
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
      color: #ffffff;
      border: none;
      border-radius: 0.75rem;
      padding: 0.85rem;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(14, 165, 233, 0.3);
    }
    .btn-submit:hover:not(:disabled) {
      background: linear-gradient(135deg, #38bdf8 0%, #1d4ed8 100%);
      transform: translateY(-1px);
    }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #f87171;
      font-size: 0.8rem;
      padding: 0.65rem;
      border-radius: 0.5rem;
      margin-top: 1rem;
      display: none;
    }
    .security-note {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 1rem;
      line-height: 1.5;
    }
    .back-link {
      display: inline-block;
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #64748b;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: #94a3b8; }
  </style>

    <!-- 自動嘗試解密中提示 -->
    <div id="loadingBox" style="display:flex;flex-direction:column;align-items:center;gap:1rem;padding:1.5rem 0;">
      <div style="width:36px;height:36px;border:3px solid rgba(56,189,248,0.2);border-top-color:#38bdf8;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
      <p style="margin:0;font-size:0.85rem;color:#38bdf8;">正在進行本裝置安全憑證驗證...</p>
    </div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>

    <div id="unlockFormBox" style="display:none;">
      <p>本頁面已透過 AES-256-GCM 高強度加密。請輸入主密碼以解鎖檢視內容。</p>

      <form id="unlockForm" onsubmit="handleUnlock(event)">
        <div class="form-group">
          <label for="pwdInput">存取授權密碼</label>
          <div class="input-wrap">
            <input type="password" id="pwdInput" placeholder="請輸入解鎖密碼..." autocomplete="current-password" required autofocus>
            <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility()" title="切換顯示密碼">👁️</button>
          </div>
        </div>

        <label style="display:flex;align-items:center;gap:0.5rem;margin-bottom:1.25rem;font-size:0.8rem;color:#cbd5e1;cursor:pointer;">
          <input type="checkbox" id="rememberDevice" style="accent-color:#0ea5e9;" checked>
          <span>在此裝置永久保持解鎖（免重複輸入）</span>
        </label>

        <button type="submit" id="submitBtn" class="btn-submit">解鎖展示內容</button>
        <div id="errorMsg" class="error-msg"></div>
        <div class="security-note">🛡️ 安全保護：採用 IndexedDB 不可匯出密鑰隔離，密碼本體絕不留存於 Storage</div>
      </form>
    </div>

          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveDeviceAuth(password) {
      try {
        const db = await openVaultDB();
        const deviceKey = await window.crypto.subtle.generateKey(
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt']
        );
        const iv = window.crypto.getRandomValues(new Uint8Array(12));
        const enc = new TextEncoder();
        const ciphertext = await window.crypto.subtle.encrypt(
          { name: 'AES-GCM', iv: iv },
          deviceKey,
          enc.encode(password)
        );
        const record = {
          id: 'device_auth',
          deviceKey: deviceKey,
          iv: iv,
          ciphertext: ciphertext,
          expiresAt: null // 永久保留，直到手動點擊鎖定或密碼更換
        };
        return new Promise((resolve, reject) => {
          const tx = db.transaction(VAULT_STORE_NAME, 'readwrite');
          tx.objectStore(VAULT_STORE_NAME).put(record);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(tx.error);
        });
      } catch (err) {
        console.warn('saveDeviceAuth failed:', err);
        return false;
      }
    }

    async function getDeviceAuth() {
      try {
        const db = await openVaultDB();
        const record = await new Promise((resolve, reject) => {
          const tx = db.transaction(VAULT_STORE_NAME, 'readonly');
          const req = tx.objectStore(VAULT_STORE_NAME).get('device_auth');
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
        if (!record) return null;
        if (record.expiresAt && Date.now() > record.expiresAt) {
          return null;
        }
        const decrypted = await window.crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: record.iv },
          record.deviceKey,
          record.ciphertext
        );
        return new TextDecoder().decode(decrypted);
      } catch (err) {
        return null;
      }
    }

    // 原生 Web Crypto API 解密
    async function decryptPayload(password, saltB64, ivB64, ctB64) {
      const salt = Uint8Array.from(atob(saltB64), c => c.charCodeAt(0));
      const iv = Uint8Array.from(atob(ivB64), c => c.charCodeAt(0));
      const ct = Uint8Array.from(atob(ctB64), c => c.charCodeAt(0));

      const enc = new TextEncoder();
      const keyMaterial = await window.crypto.subtle.importKey(
        'raw',
        enc.encode(password),
        'PBKDF2',
        false,
        ['deriveKey']
      );

      const key = await window.crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt: salt,
          iterations: 100000,
          hash: 'SHA-256'
        },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );

      const decrypted = await window.crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: iv },
        key,
        ct
      );

      return new TextDecoder().decode(decrypted);
    }

    // 將解密內容無縫渲染至當前頁面
    function renderDecryptedDocument(html) {
      document.open();
      document.write(html);
      document.close();
    }

    function togglePasswordVisibility() {
      const input = document.getElementById('pwdInput');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    // 手動提交解密表單
    async function handleUnlock(event) {
      event.preventDefault();
      const input = document.getElementById('pwdInput');
      const submitBtn = document.getElementById('submitBtn');
      const errorMsg = document.getElementById('errorMsg');
      const remember = document.getElementById('rememberDevice').checked;
      const pwd = input.value.trim();

      if (!pwd) return;

      submitBtn.disabled = true;
      submitBtn.innerText = '正在驗證並解密...';
      errorMsg.style.display = 'none';

      try {
        const decryptedHtml = await decryptPayload(pwd, payload.salt, payload.iv, payload.ciphertext);
        if (remember) {
          await saveDeviceAuth(pwd);
        }
        renderDecryptedDocument(decryptedHtml);
      } catch (err) {
        console.error('Decryption failed:', err);
        errorMsg.innerText = '密碼錯誤或解密失敗，請重新輸入！';
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = '解鎖展示內容';
        input.select();
      }
    }

    // 頁面初始化：嘗試自動從 IndexedDB 憑證解密
    (async function init() {
      try {
        sessionStorage.removeItem('KU_DEMO_PASSWORD');
        localStorage.removeItem('KU_DEMO_PASSWORD');
      } catch (e) {}

      const savedPwd = await getDeviceAuth();
      if (savedPwd) {
        try {
          const decryptedHtml = await decryptPayload(savedPwd, payload.salt, payload.iv, payload.ciphertext);
          renderDecryptedDocument(decryptedHtml);
          return;
        } catch (e) {
          console.warn('Saved auth invalid:', e);
        }
      }

      const loadBox = document.getElementById('loadingBox');
      if (loadBox) loadBox.style.display = 'none';
      document.getElementById('unlockFormBox').style.display = 'block';
      document.getElementById('pwdInput').focus();
    })();
  </script>
