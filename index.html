<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ku Visual Hub - 互動視覺化展示中心</title>
  
  <!-- SEO & Social Meta -->
  <meta name="description" content="Ku 工作區專屬視覺化展示中心，提供各項數據分析、籌碼動能、策略回測與原型互動展示。">
  <meta name="theme-color" content="#0f172a">

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ku Visual Hub">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="alternate icon" href="icons/icon-192.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1'
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    .glass {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">

  <!-- Navbar -->
  <header class="sticky top-0 z-30 border-b border-slate-800/80 glass px-4 lg:px-8 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-500 to-indigo-600 p-0.5 shadow-lg shadow-cyan-500/20 flex items-center justify-center">
        <img src="icons/icon.svg" alt="Logo" class="w-full h-full rounded-[10px]">
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-base lg:text-lg font-black tracking-wide bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent">
            Ku Visual Hub
          </h1>
          <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
            PWA
          </span>
        </div>
        <p class="text-xs text-slate-400 hidden sm:block">ku_tools 視覺化展示與互動儀表板中心</p>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-2.5">
      <!-- PWA Install Button (Hidden by default, shown when prompt available) -->
      <button id="pwaInstallBtn" class="hidden items-center gap-1.5 px-3 py-1.5 rounded-lg bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white text-xs font-semibold shadow-md shadow-cyan-500/20 transition active:scale-95">
        <i data-lucide="download" class="w-3.5 h-3.5"></i>
        <span>安裝 PWA</span>
      </button>

      <!-- GitHub Link -->
      <a href="https://github.com/starrain3/DEMO" target="_blank" rel="noopener noreferrer" class="p-2 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-white transition" title="GitHub Repository">
        <i data-lucide="github" class="w-4 h-4"></i>
      </a>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="border-b border-slate-900 bg-gradient-to-b from-slate-900/50 via-slate-950 to-slate-950 px-4 lg:px-8 py-8 lg:py-10">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-6">
      <div class="space-y-2">
        <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-slate-800/80 border border-slate-700/60 text-xs text-slate-300">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>GitHub Pages & 離線快取就緒</span>
        </div>
        <h2 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
          互動視覺化展示庫
        </h2>
        <p class="text-sm text-slate-400 max-w-2xl leading-relaxed">
          所有在工作區中產出的策略分析、籌碼動能、資料模型與功能原型，均會自動整合為互動式展示模組，隨時點擊即時探索。
        </p>
      </div>

      <!-- Quick Metrics -->
      <div class="flex items-center gap-3">
        <div class="px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-800/80 text-center min-w-[100px]">
          <div id="statTotalDemos" class="text-xl font-bold text-cyan-400 font-mono">1</div>
          <div class="text-[11px] text-slate-500 mt-0.5">展示項目</div>
        </div>
        <div class="px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-800/80 text-center min-w-[100px]">
          <div class="text-xl font-bold text-emerald-400 font-mono">Ready</div>
          <div class="text-[11px] text-slate-500 mt-0.5">PWA 狀態</div>
        </div>
        <div class="px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-800/80 text-center min-w-[100px]">
          <div class="text-xl font-bold text-indigo-400 font-mono">1.0.2</div>
          <div class="text-[11px] text-slate-500 mt-0.5">版本號</div>
        </div>
      </div>
    </div>
  </section>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 lg:px-8 py-6 space-y-6">
    <!-- Filters & Search Toolbar -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
      <!-- Category Pills -->
      <div id="categoryContainer" class="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0 scrollbar-none">
        <button data-category="ALL" class="cat-pill active px-3.5 py-1.5 rounded-lg text-xs font-semibold transition bg-cyan-500 text-white shadow-sm shadow-cyan-500/20">
          全部項目
        </button>
        <button data-category="財務與籌碼" class="cat-pill px-3.5 py-1.5 rounded-lg text-xs font-semibold transition bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-800">
          財務與籌碼
        </button>
        <button data-category="策略回測" class="cat-pill px-3.5 py-1.5 rounded-lg text-xs font-semibold transition bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-800">
          策略回測
        </button>
        <button data-category="技術原型" class="cat-pill px-3.5 py-1.5 rounded-lg text-xs font-semibold transition bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-800">
          技術原型
        </button>
      </div>

      <!-- Search Input -->
      <div class="relative min-w-[240px]">
        <i data-lucide="search" class="w-4 h-4 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input id="searchInput" type="text" placeholder="搜尋視覺化名稱或標籤..." class="w-full bg-slate-900 border border-slate-800 rounded-lg pl-9 pr-4 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition">
      </div>
    </div>

    <!-- Cards Grid -->
    <div id="demosGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- Loading skeleton -->
      <div class="col-span-full py-16 text-center text-slate-500 text-sm flex flex-col items-center gap-3">
        <i data-lucide="loader-2" class="w-6 h-6 animate-spin text-cyan-500"></i>
        <span>正在載入展示清單...</span>
      </div>
    </div>
  </main>

  <!-- Interactive Viewer Modal (Preview inside PWA) -->
  <div id="viewerModal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md hidden flex flex-col">
    <!-- Modal Header -->
    <div class="px-4 py-3 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button id="closeViewerBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium transition">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
          <span>返回清單</span>
        </button>
        <h3 id="modalTitle" class="text-sm font-bold text-white truncate max-w-[200px] sm:max-w-md">展示預覽</h3>
      </div>
      <div class="flex items-center gap-2">
        <button id="reloadIframeBtn" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white transition" title="重新載入">
          <i data-lucide="rotate-cw" class="w-4 h-4"></i>
        </button>
        <a id="modalNewTabBtn" href="#" target="_blank" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white transition" title="新分頁開啟">
          <i data-lucide="external-link" class="w-4 h-4"></i>
        </a>
      </div>
    </div>
    <!-- Modal Body (Iframe) -->
    <div class="flex-1 w-full bg-slate-950 relative">
      <iframe id="viewerFrame" src="" class="w-full h-full border-none"></iframe>
    </div>
  </div>

  <!-- Footer -->
  <footer class="border-t border-slate-900 bg-slate-950 px-4 lg:px-8 py-6 text-center text-xs text-slate-500">
    <p>© 2026 Ku Visual Hub • Built with Modern Web & PWA Technology for GitHub Pages</p>
  </footer>

  <!-- App Script -->
  <script>
    // State
    let allDemos = [];
    let currentCategory = 'ALL';
    let searchQuery = '';
    let deferredPrompt = null;

    // Update Manager State
    let swRegistration = null;
    let newWorkerWaiting = null;
    let lastCheckedTime = Date.now();
    const CHECK_THROTTLE_MS = 15 * 60 * 1000; // 15 mins throttle

    function showUpdateToast(worker) {
      newWorkerWaiting = worker;
      const toast = document.getElementById('updateToast');
      if (toast) {
        toast.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
        toast.classList.add('translate-y-0', 'opacity-100');
        if (window.lucide) lucide.createIcons();
      }
    }

    function hideUpdateToast() {
      const toast = document.getElementById('updateToast');
      if (toast) {
        toast.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }
    }

    // Auto-Reload when new SW takes control
    let isRefreshing = false;
    navigator.serviceWorker?.addEventListener('controllerchange', () => {
      if (!isRefreshing) {
        isRefreshing = true;
        window.location.reload();
      }
    });

    // Service Worker Registration & Lifecycle Tracking
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          swRegistration = await navigator.serviceWorker.register('./sw.js');
          console.log('[PWA] Service Worker registered:', swRegistration.scope);

          // If there is already a waiting worker from previous visit
          if (swRegistration.waiting) {
            showUpdateToast(swRegistration.waiting);
          }

          // Listen for new updates found
          swRegistration.addEventListener('updatefound', () => {
            const installingWorker = swRegistration.installing;
            if (!installingWorker) return;
            installingWorker.addEventListener('statechange', () => {
              if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                // New version downloaded & waiting
                showUpdateToast(installingWorker);
              }
            });
          });

          // Setup Smart Auto-Check Triggers
          setupUpdateCheckers();
        } catch (err) {
          console.warn('[PWA] Service Worker registration failed:', err);
        }
      });
    }

    // Trigger update check safely with throttle (costs almost 0 resources)
    function checkForUpdates(force = false) {
      if (!swRegistration || !navigator.onLine) return;
      const now = Date.now();
      if (!force && (now - lastCheckedTime < CHECK_THROTTLE_MS)) return;
      lastCheckedTime = now;
      console.log('[PWA] Checking for updates in background...');
      swRegistration.update().catch((err) => console.log('[PWA] Update check failed:', err));
    }

    function setupUpdateCheckers() {
      // 1. When user switches back to tab or unlocks device
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          checkForUpdates();
        }
      });

      // 2. When device comes back online
      window.addEventListener('online', () => {
        checkForUpdates(true);
      });

      // 3. Periodic low-frequency check (every 30 mins)
      setInterval(() => {
        checkForUpdates();
      }, 30 * 60 * 1000);
    }

    // PWA Install prompt handling
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('pwaInstallBtn');
      if (btn) {
        btn.classList.remove('hidden');
        btn.classList.add('flex');
      }
    });

    document.getElementById('pwaInstallBtn').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      console.log('[PWA] User response:', outcome);
      deferredPrompt = null;
      document.getElementById('pwaInstallBtn').classList.add('hidden');
    });

    // Fetch Demos
    async function loadDemos() {
      try {
        const res = await fetch('./data/demos.json');
        if (!res.ok) throw new Error('Failed to load demos.json');
        allDemos = await res.json();
        document.getElementById('statTotalDemos').innerText = allDemos.length;
        renderDemos();
      } catch (err) {
        console.error('Error loading demos:', err);
        document.getElementById('demosGrid').innerHTML = `
          <div class="col-span-full py-12 text-center text-rose-400 text-sm">
            無法載入展示項目資料，請確認 data/demos.json 是否存在。
          </div>
        `;
      }
    }

    // Render Demos
    function renderDemos() {
      const container = document.getElementById('demosGrid');
      const filtered = allDemos.filter((demo) => {
        const matchesCategory = (currentCategory === 'ALL' || demo.category === currentCategory);
        const q = searchQuery.toLowerCase();
        const matchesSearch = !q || 
          demo.title.toLowerCase().includes(q) || 
          demo.description.toLowerCase().includes(q) || 
          (demo.tags && demo.tags.some(t => t.toLowerCase().includes(q)));
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-16 text-center text-slate-500 text-sm flex flex-col items-center gap-2">
            <i data-lucide="inbox" class="w-8 h-8 text-slate-600"></i>
            <span>尚無符合條件的展示項目</span>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      container.innerHTML = filtered.map((demo) => {
        const tagsHtml = (demo.tags || []).map(tag => `
          <span class="px-2 py-0.5 rounded text-[11px] bg-slate-800 text-slate-300 border border-slate-700/60 font-mono">${tag}</span>
        `).join('');

        const badgeHtml = demo.badge ? `
          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">
            ${demo.badge}
          </span>
        ` : '';

        return `
          <div class="group bg-slate-900 border border-slate-800/80 hover:border-cyan-500/40 rounded-2xl p-5 shadow-lg hover:shadow-cyan-500/5 transition-all duration-300 flex flex-col justify-between">
            <div class="space-y-3">
              <div class="flex items-center justify-between gap-2">
                <span class="text-xs font-semibold text-slate-400 flex items-center gap-1.5">
                  <span class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>
                  ${demo.category || '未分類'}
                </span>
                ${badgeHtml}
              </div>

              <div>
                <h4 class="text-base font-bold text-white group-hover:text-cyan-400 transition">
                  ${demo.title}
                </h4>
                <p class="text-xs text-slate-400 mt-1.5 leading-relaxed line-clamp-2">
                  ${demo.description}
                </p>
              </div>

              <div class="flex flex-wrap gap-1.5 pt-1">
                ${tagsHtml}
              </div>
            </div>

            <div class="pt-5 mt-4 border-t border-slate-800/60 flex items-center justify-between gap-2">
              <span class="text-[11px] text-slate-500 font-mono">${demo.date || ''}</span>
              <div class="flex items-center gap-2">
                <button onclick="openViewer('${demo.url}', '${encodeURIComponent(demo.title)}')" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 text-xs font-semibold border border-cyan-500/30 transition">
                  <i data-lucide="play" class="w-3.5 h-3.5"></i>
                  <span>預覽</span>
                </button>
                <a href="${demo.url}" target="_blank" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-slate-200 transition" title="另開新分頁">
                  <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                </a>
              </div>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    // Modal Viewer
    function openViewer(url, title) {
      const modal = document.getElementById('viewerModal');
      const iframe = document.getElementById('viewerFrame');
      const modalTitle = document.getElementById('modalTitle');
      const newTabBtn = document.getElementById('modalNewTabBtn');

      modalTitle.innerText = decodeURIComponent(title);
      iframe.src = url;
      newTabBtn.href = url;
      modal.classList.remove('hidden');
    }

    document.getElementById('closeViewerBtn').addEventListener('click', () => {
      const modal = document.getElementById('viewerModal');
      const iframe = document.getElementById('viewerFrame');
      iframe.src = '';
      modal.classList.add('hidden');
    });

    document.getElementById('reloadIframeBtn').addEventListener('click', () => {
      const iframe = document.getElementById('viewerFrame');
      if (iframe.src) iframe.src = iframe.src;
    });

    // Category Filter Pills
    document.querySelectorAll('.cat-pill').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-pill').forEach(b => {
          b.classList.remove('bg-cyan-500', 'text-white', 'shadow-sm', 'shadow-cyan-500/20');
          b.classList.add('bg-slate-900', 'text-slate-400', 'border', 'border-slate-800');
        });
        btn.classList.add('bg-cyan-500', 'text-white', 'shadow-sm', 'shadow-cyan-500/20');
        btn.classList.remove('bg-slate-900', 'text-slate-400', 'border', 'border-slate-800');
        currentCategory = btn.getAttribute('data-category');
        renderDemos();
      });
    });

    // Search Input Listener
    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderDemos();
    });

    // Update Toast Actions
    document.getElementById('applyUpdateBtn')?.addEventListener('click', () => {
      if (newWorkerWaiting) {
        newWorkerWaiting.postMessage({ type: 'SKIP_WAITING' });
      } else if (swRegistration && swRegistration.waiting) {
        swRegistration.waiting.postMessage({ type: 'SKIP_WAITING' });
      }
      hideUpdateToast();
    });

    document.getElementById('dismissUpdateBtn')?.addEventListener('click', () => {
      hideUpdateToast();
    });

    // Initial Load
    loadDemos();
    lucide.createIcons();
  </script>

  <!-- Update Notification Toast -->
  <div id="updateToast" class="fixed bottom-6 right-6 z-50 max-w-sm w-full mx-4 sm:mx-0 p-4 rounded-2xl bg-slate-900/95 border border-cyan-500/40 shadow-2xl shadow-cyan-500/10 backdrop-blur-md transform transition-all duration-300 translate-y-24 opacity-0 pointer-events-none flex items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 flex items-center justify-center shrink-0">
        <i data-lucide="sparkles" class="w-4 h-4"></i>
      </div>
      <div>
        <h4 class="text-xs font-bold text-white">發現新版本！</h4>
        <p class="text-[11px] text-slate-400">系統已完成背景更新下載，立即套用以取得最新展示內容。</p>
      </div>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <button id="applyUpdateBtn" class="px-3 py-1.5 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-white text-xs font-bold shadow-md shadow-cyan-500/25 transition active:scale-95">
        立即更新
      </button>
      <button id="dismissUpdateBtn" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>
  </div>
</body>
</html>
