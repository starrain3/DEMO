<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="bar1Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="bar2Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="bar3Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.3"/>
  
  <!-- Grid Lines -->
  <line x1="80" y1="360" x2="432" y2="360" stroke="#334155" stroke-width="3" stroke-dasharray="6 6"/>
  <line x1="80" y1="280" x2="432" y2="280" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="80" y1="200" x2="432" y2="200" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/>
  
  <!-- Bars -->
  <rect x="110" y="250" width="54" height="110" rx="12" fill="url(#bar1Grad)"/>
  <rect x="200" y="180" width="54" height="180" rx="12" fill="url(#bar2Grad)"/>
  <rect x="290" y="120" width="54" height="240" rx="12" fill="url(#bar3Grad)"/>
  
  <!-- Trend Line -->
  <polyline points="137,230 227,150 317,95 400,140" fill="none" stroke="#f43f5e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Indicator dots -->
  <circle cx="137" cy="230" r="9" fill="#f43f5e"/>
  <circle cx="227" cy="150" r="9" fill="#f43f5e"/>
  <circle cx="317" cy="95" r="11" fill="#fb7185"/>
  <circle cx="400" cy="140" r="9" fill="#f43f5e"/>
  
  <!-- Sparkles -->
  <polygon points="317,70 322,82 334,85 324,94 327,106 317,98 307,106 310,94 300,85 312,82" fill="#fef08a" />
</svg>

